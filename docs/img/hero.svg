<text class="ink2" x="24" y="62" font-size="13">One Simon game, one C GUI library, four bindings — what does each stack add to a Windows build?</text><rect class="box" x="24" y="84" width="169" height="92" rx="10" stroke-width="1"/><rect class="s1" x="24" y="84" width="169" height="4" rx="2"/><text class="ink2" x="38" y="110" font-size="12" font-weight="600">Rust</text><text class="ink" x="38" y="142" font-size="28" font-weight="700">1.60<tspan font-size="14" font-weight="600" dx="4">MiB</tspan></text><text class="muted" x="38" y="162" font-size="11">1 file · +229 KiB over C</text><rect class="box" x="205" y="84" width="169" height="92" rx="10" stroke-width="1"/><rect class="s1" x="205" y="84" width="169" height="4" rx="2"/><text class="ink2" x="219" y="110" font-size="12" font-weight="600">Kotlin/Native</text><text class="ink" x="219" y="142" font-size="28" font-weight="700">2.04<tspan font-size="14" font-weight="600" dx="4">MiB</tspan></text><text class="muted" x="219" y="162" font-size="11">1 file · +681 KiB over C</text><rect class="box" x="386" y="84" width="169" height="92" rx="10" stroke-width="1"/><rect class="s1" x="386" y="84" width="169" height="4" rx="2"/><text class="ink2" x="400" y="110" font-size="12" font-weight="600">Java · GraalVM</text><text class="ink" x="400" y="142" font-size="28" font-weight="700">17.5<tspan font-size="14" font-weight="600" dx="4">MiB</tspan></text><text class="muted" x="400" y="162" font-size="11">2 files · +16.2 MiB over C</text><rect class="box" x="567" y="84" width="169" height="92" rx="10" stroke-width="1"/><rect class="s1" x="567" y="84" width="169" height="4" rx="2"/><text class="ink2" x="581" y="110" font-size="12" font-weight="600">Java · jlink</text><text class="ink" x="581" y="142" font-size="28" font-weight="700">28.5<tspan font-size="14" font-weight="600" dx="4">MiB</tspan></text><text class="muted" x="581" y="162" font-size="11">41 files · +27.1 MiB over C</text>
