<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-labelledby="t d">
<title id="t">Build pipeline</title><desc id="d">Raven is cross-compiled once in Docker into libraven.a and raven.dll; C, Rust and Kotlin/Native link the static library in Docker, Java jlink uses the DLL in Docker, GraalVM native-image runs on the Windows host with MSVC.</desc>
