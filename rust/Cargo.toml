[package]
name = "simon"
version = "0.1.0"
edition = "2021"

[dependencies]
# The binding generated by Raven (bindings/rust). The path is the one inside the
# build container (see Dockerfile); RAVEN_STATIC=1 links libraven.a into the exe.
raven = { package = "raven-gui", path = "/src/raven/bindings/rust" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
